[mgr]
sort_by = "alphabetical"
sort_sensitive = false
sort_dir_first = true
show_hidden = true
linemode = "size"

# Use piper as previewer for some file types
[[plugin.prepend_previewers]]
url = "*.csv"
run = 'piper -- bat -p --color=always "$1"'
[[plugin.prepend_previewers]]
url = "*.tar*"
run = 'piper --format=url -- tar tf "$1"'
[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# Fallback previewer: hexyl
[[plugin.append_previewers]]
url = "*"
run = 'piper -- hexyl --border=none --terminal-width=$w "$1"'

[opener]
pdf = [
  { run = 'zathura %s', desc = "zathura", block = false },
  { run = 'papers "%s', desc = "papers", block = false },
  { run = 'evince %s', desc = "evince", block = false },
  { run = 'xournalpp %s', desc = "xournal++", block = false },
]
image = [
  { run = 'nsxiv %s', desc = "nsxiv", block = false },
  { run = 'eog "%s', desc = "eog", block = false },
  { run = 'krita %s', desc = "krita", block = false },
  { run = 'flatpak run org.kde.krita %s', desc = "krita (flatpak)", block = false },
  { run = 'feh %s', desc = "feh", block = false },
  { run = 'gimp %s', desc = "gimp", block = false },
  { run = 'flatpak run org.gimp.GIMP %s', desc = "gimp (flatpak)", block = false },
]
text = [
  { run = 'less %s', desc = "less", block = true },
  { run = 'bat %s', desc = "bat", block = true },
]
edit = [
  { run = 'ms %s', desc = "mitos", block = true },
  { run = 'helix %s', desc = "helix", block = true },
  { run = 'nvim %s', desc = "nvim", block = true },
  { run = 'gedit %s', desc = "gedit", block = false },
]
markdown = [{ run = 'glow -p %s', desc = "glow", block = true }]
video = [{ run = 'mpv %s', desc = "mpv", block = false }]
audio = [{ run = 'mpv --force-window %s', desc = "mpv", block = false }]

[open]
prepend_rules = [
  # File extensions
  { url = "*.pdf", use = "pdf" },
  { url = "*.json", use = "edit" },
  { url = "*.md", use = ["markdown", "edit"] },
  { url = "*.html", use = ["edit", "text"] },
  { url = "*.sh", use = "edit" },
  { url = "*.txt", use = ["edit", "text"] },
  { url = "*.csv", use = "edit" },
  { url = "*.dat", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.lua", use = ["edit", "text"] },
  { url = "*.log", use = "text" },
  { url = "*.rs", use = ["edit", "text"] },
  { url = "*.js", use = ["edit", "text"] },
  { url = "*.ts", use = ["edit", "text"] },
  { url = "*.mp3", use = "audio" },
  { url = "*.wav", use = "audio" },
  { url = "*.ogg", use = "audio" },

  # Mime types
  { mime = "application/pdf", use = "pdf" },
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "video" },
  { mime = "audio/*", use = "audio" },
  { mime = "text/markdown", use = ["markdown", "edit", "text"] },
  { mime = "text/*", use = ["edit", "text"] },
]
append_rules = [{ url = "*", use = "less" }]
