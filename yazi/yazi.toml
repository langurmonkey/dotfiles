[mgr]
sort_by = "alphabetical"
sort_sensitive = false
sort_dir_first = true
show_hidden = true
linemode = "size"

[opener]
pdf = [
	{ run = 'zathura %s', desc = "zathura", block = false },
	{ run = 'papers "%s', desc = "papers", block = false },
	{ run = 'evince %s', desc = "evince", block = false },
	{ run = 'xournalpp %s', desc = "xournal++", block = false },
]
image = [
    { run = 'nsxiv %s', desc = "nsxiv", block = false },
    { run = 'eog "%s', desc = "eog", block = false },
    { run = 'krita %s', desc = "krita", block = false },
    { run = 'flatpak run org.kde.krita %s', desc = "krita (flatpak)", block = false },
    { run = 'feh %s', desc = "feh", block = false },
    { run = 'gimp %s', desc = "gimp", block = false },
    { run = 'flatpak run org.gimp.GIMP %s', desc = "gimp (flatpak)", block = false },
]
text = [
    { run = 'less %s', desc = "less", block = true },
    { run = 'bat %s', desc = "bat", block = true },
]
edit = [
    { run = 'helix %s', desc = "helix", block = true },
    { run = 'nvim %s', desc = "nvim", block = true },
    { run = 'gedit %s', desc = "gedit", block = false },
]
video = [
    { run = 'mpv %s', desc = "mpv", block = false },
]
audio = [
    { run = 'mpv --force-window %s', desc = "mpv", block = false },
]

[open]
prepend_rules = [
  # Mime types
  { mime = "application/pdf", use = "pdf" },
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "video" },
  { mime = "audio/*", use = "audio" },
  { mime = "text/*", use = ["edit", "text"] },

  # File extensions
  { url = "*.pdf", use = "pdf" },
  { url = "*.json", use = "edit" },
  { url = "*.md", use = "edit" },
  { url = "*.html", use = ["edit", "text"] },
  { url = "*.sh", use = "edit" },
  { url = "*.txt", use = ["edit", "text"] },
  { url = "*.csv", use = "edit" },
  { url = "*.dat", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.lua", use = ["edit", "text"] },
  { url = "*.log", use = "text" },
  { url = "*.rs", use = ["edit", "text"] },
  { url = "*.js", use = ["edit", "text"] },
  { url = "*.ts", use = ["edit", "text"] },
  { url = "*.mp3", use = "audio" },
  { url = "*.wav", use = "audio" },
  { url = "*.ogg", use = "audio" },
]
append_rules = [
	{ url = "*", use = "less" },
]
