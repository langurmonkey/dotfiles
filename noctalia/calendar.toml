[calendar]
enabled = true
dedupe_events = false # merge an event that appears in more than one calendar into a single entry
dedupe_ignore_patterns = [
] # regexes stripped from a title before events are compared
refresh_minutes = 15
event_date_format = "%A %e %B"
event_time_format = "%H:%M"

# iCloud CalDAV. The table name is the local account id.
[calendar.account.personal_icloud]
type = "caldav"
name = "Personal Calendar"
provider = "custom"
server_url = "https://dav.mailbox.org/caldav/Y2FsOi8vMC8zMQ"
username = "me@tonisagrista.com"
color = "primary"
calendars = []
