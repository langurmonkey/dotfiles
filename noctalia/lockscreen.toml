[lockscreen]
enabled = true
transition_duration = 500
blurred_desktop = true
blur_intensity = 0.7
tint_intensity = 0.3

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "main_clock", "lockscreen-login-box" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."main_clock"]
    box_height = 144.0
    box_width = 544.0
    cx = 1584.0
    cy = 132.0
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget."main_clock".settings]
    clock_style = "digital"
    format = "{:%Y-%m-%d}\n{:%H:%M}"

    [lockscreen_widgets.widget."lockscreen-login-box"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true
